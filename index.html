<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Tocador de Música</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="player-container">
        <div class="cover-art">
            <img src="./img/vinil.jpg" alt="Capa do Álbum">
        </div>

        <div class="player-controls">
            <h2 id="song-title">Nome da Música</h2>
            <h3 id="artist-name">Nome do Artista</h3>

            <div class="progress-container">
                <div id="progress-bar" class="progress-bar"></div>
            </div>
            <div class="time-info">
                <span id="current-time">0:00</span>
                <span id="duration-time">0:00</span>
            </div>

            <div class="buttons-container">
                <button id="prev" class="control-button"><i class="fas fa-backward"></i></button>
                <button id="play-pause" class="control-button"><i class="fas fa-play"></i></button>
                <button id="next" class="control-button"><i class="fas fa-forward"></i></button>
            </div>

            <audio id="audio" src=""></audio>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
